<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
<style>
.i{background-color: black;
display: inline-block;
}
.il,.ir{
    background-color: white;
    display: inline-block;
    width:20px;
    height: 50px;


}
.il{
    margin: 12px 5px 10px 0;
}
.ir{ margin: 12px 0  10px  5px;

}


.h{background-color: white;
    display: inline-block;
    padding: 5px;
}

.hl, .hr{background-color: coral;
    display: inline-block;
    width: 20px;
    height: 90px;
    vertical-align: middle;
}

.hm{background-color: coral;
    display: inline-block;
    width: 40px;
    height: 20px;
    vertical-align: middle;
}



</style>
</head>
<body>
<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>

<div class="h">
    <div class="hl"></div>
    <div class="hm"></div>
    <div class="hr"></div>
</div>

</body>
</html>
