<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 16</title>

    <style>
        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Registration Form</h1>

    <form id="registrationForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter your password" required>

        <div id="passwordRules" style="display: none;">
            <p>Password must contain:</p>
            <ul>
                <li id="lengthRule">At least 6 characters</li>
                <li id="specialRule">A special character (!@#$...)</li>
                <li id="uppercaseRule">An uppercase letter (A-Z)</li>
            </ul>
        </div>

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.getElementById("registrationForm");
        const passwordInput = document.getElementById("password");
        const passwordRules = document.getElementById("passwordRules");

        const lengthRule = document.getElementById("lengthRule");
        const specialRule = document.getElementById("specialRule");
        const uppercaseRule = document.getElementById("uppercaseRule");

        // Form submit event
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            window.location.href = "success.html";
        });

        // Password input event
        passwordInput.addEventListener("input", function() {
            const password = passwordInput.value;

            // Show password rules when typing
            passwordRules.style.display = "block";

            // Check password conditions
            const hasLength = password.length >= 6;
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const hasUppercase = /[A-Z]/.test(password);

            // Update rule colors
            lengthRule.classList.toggle("valid", hasLength);
            lengthRule.classList.toggle("invalid", !hasLength);

            specialRule.classList.toggle("valid", hasSpecial);
            specialRule.classList.toggle("invalid", !hasSpecial);

            uppercaseRule.classList.toggle("valid", hasUppercase);
            uppercaseRule.classList.toggle("invalid", !hasUppercase);
        });
    </script>

</body>
</html>
