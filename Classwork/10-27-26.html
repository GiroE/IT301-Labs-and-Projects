<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise fetch and API</title>
</head>
<body>
    <h1>Cute cats</h1>
    <p>Welcome to my cute cats page.</p>
    <script>
        //create the promise
        const p = new Promise((resolve,reject)=>{
            const grade = 90;
            if (grade > 50){resolve('Pass the class Yippee !!')}
            else {reject('Fail the class :( ')}
        });
            /*consume the promise
        p.then(success => console.log(success)).catch(reason => console.log(reason)).finally(console.log('Thats all!')); */


        //consume the promise with try and catch <clean way>

        /* const checkGrade = async()=>{
            try{
                const result = await p;
                console.log(result);
            }catch{(reason)=>console.log(reason);}
        }
        checkGrade();   */
        let img = document.createElement('img');
        let form = document.createElement('form');
        let bttn = document.createElement('button');

        form.action = '#';
        bttn.type = 'button';
        bttn.textContent = 'get a cute cat'
        form.appendChild(bttn);
        document.body.appendChild(form);
        const getImg = async()=>{
        try{
            let imgAdd = await fetch("https://api.thecatapi.com/v1/images/search");
            imgAdd = await imgAdd.json;


            img.src = imgAdd[0].url;
            img.alt = 'cute cat';
            img.style.width = '300px';
            document.body.appendChild(img);


        }catch{(reason)=> console.log(reason);}


        }
        bttn.addEventListener('click', getImg);
    </script>
</body>
</html>
