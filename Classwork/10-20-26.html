<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.value and functions</title>
    <style>
    </style>
</head>
<body>
    <form action="#">
        <label for="grade">What is your grade?</label>
        <input type="number" id="grade">
        <button id = "button" type="button">Submit</button>
        <p id="result"></p>

        <p>First number:</p>
        <input type="radio" name = "color" value = "red">Red<br>
        <input type="radio" name = "color" value = "green">Green<br>
        <input type="radio" name = "color" value = "blue">Blue<br>
        <button type="button" id="select">Select</button>

    </form>


    <script>
        const grade = document.getElementById("grade");
        const result = document.getElementById("result");
        document.getElementById("button").addEventListener("click", function(event){
            result.textContent = Number(grade.value) + 5;
            console.log(typeof grade.value);
        });


        document.getElementById("select").addEventListener("click", function(event){
            const color = document.querySelector("[name = color]:checked");
            console.log(color.value);
        });

        const sub = (a, b) => a - b;
        console.log(sub(5, 3));


        const greet = myName => console.log(myName);
        const greeting = greet;
    </script>
</body>
</html>
