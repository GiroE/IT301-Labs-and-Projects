<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Part 2</title>
    <style>
        body>div{
            border: solid 2px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 100vh;

        }
        div div{
            background-color: aqua;
            width: 100px;
            height: 100px;
            border: 1px solid;
        }
        #child2{
            align-self: center;
        }
    </style>
</head>
<body>
    <div id="flex-parent">
        <div id="child1">1</div>
        <div id="child2">2</div>
        <div id="child3">3</div>
    </div>
</body>
</html>
